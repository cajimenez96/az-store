# Nixpacks configuration for Coolify deployments.
# The base Nixpacks node image already provides Node.js, so we only need
# to install Bun (the project's package manager) before running install.

[phases.install]
cmds = ["curl -fsSL https://bun.sh/install | bash", "bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
# Apply pending Prisma migrations before serving. If a migration fails the
# container exits and the previous deployment keeps serving traffic.
cmd = "bunx prisma migrate deploy && bun run start"